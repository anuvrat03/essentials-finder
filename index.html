<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Essentials Finder</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: Arial, sans-serif; padding: 10px; background: #f4f6f8; margin: 0; }
    h2 { color: #2c3e50; margin: 5px 0 2px 0; }
    p { margin: 0 0 8px 0; color: #555; font-size: 13px; }
    
    .cat-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .cat-btn {
      flex: 1 1 30%;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: #333;
      cursor: pointer;
    }
    .cat-btn.active { background: #27ae60; color: white; border-color: #27ae60; }
    
    .relocate-btn {
      width: 100%;
      padding: 10px;
      background: #2980b9;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .fallback-btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 10px;
      background: #34495e;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      margin-top: 8px;
      box-sizing: border-box;
    }

    #map { height: 220px; width: 100%; border-radius: 8px; margin-bottom: 10px; }
    #status { font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #2c3e50; }
    
    .card {
      background: white;
      padding: 10px;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      margin-bottom: 8px;
    }
    .dir-btn {
      display: inline-block;
      margin-top: 5px;
      padding: 5px 10px;
      background: #27ae60;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>🧭 Essentials Finder</h2>
  <p>Find nearby hospitals, ATMs, fuel pumps, and essential services.</p>

  <button class="relocate-btn" onclick="requestPreciseLocation()">🎯 Refresh Exact Location</button>

  <div class="cat-bar">
    <button class="cat-btn active" onclick="switchCategory('fuel')">⛽ Fuel</button>
    <button class="cat-btn" onclick="switchCategory('hospital')">🏥 Hospital</button>
    <button class="cat-btn" onclick="switchCategory('atm')">🏧 ATM</button>
    <button class="cat-btn" onclick="switchCategory('pharmacy')">💊 Pharmacy</button>
    <button class="cat-btn" onclick="switchCategory('police')">👮 Police</button>
  </div>

  <div id="status">Locking onto GPS location...</div>
  <div id="map"></div>
  <div id="results"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, userMarker, placesGroup;
    let userLat = null, userLon = null;
    let currentCat = 'fuel';

    const queries = {
      fuel: '(node["amenity"="fuel"](around:5000,{lat},{lon});way["amenity"="fuel"](around:5000,{lat},{lon}););',
      hospital: '(node["amenity"="hospital"](around:5000,{lat},{lon});way["amenity"="hospital"](around:5000,{lat},{lon}););',
      atm: '(node["amenity"="atm"](around:3000,{lat},{lon});node["amenity"="bank"](around:3000,{lat},{lon}););',
      pharmacy: '(node["amenity"="pharmacy"](around:3000,{lat},{lon}););',
      police: '(node["amenity"="police"](around:5000,{lat},{lon});way["amenity"="police"](around:5000,{lat},{lon}););'
    };

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function requestPreciseLocation() {
      document.getElementById('status').innerText = "Updating location...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLat = pos.coords.latitude;
          userLon = pos.coords.longitude;
          if (!map) {
            initMap();
          } else {
            map.setView([userLat, userLon], 15);
            if (userMarker) map.removeLayer(userMarker);
            userMarker = L.marker([userLat, userLon]).addTo(map).bindPopup("You are here").openPopup();
          }
          loadData();
        },
        (err) => {
          document.getElementById('status').innerText = "Please enable Location access on your phone.";
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }

    function switchCategory(cat) {
      currentCat = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      if (event && event.target) event.target.classList.add('active');
      loadData();
    }

    function initMap() {
      map = L.map('map').setView([userLat, userLon], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      placesGroup = L.layerGroup().addTo(map);
      userMarker = L.marker([userLat, userLon]).addTo(map).bindPopup("You are here").openPopup();
    }

    async function loadData() {
      if (!userLat || !userLon) return;

      document.getElementById('status').innerText = `Searching nearby ${currentCat.toUpperCase()} spots...`;
      placesGroup.clearLayers();
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = "";

      const rawQuery = queries[currentCat].replaceAll('{lat}', userLat).replaceAll('{lon}', userLon);
      const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent('[out:json][timeout:25];' + rawQuery + 'out center;')}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        let spots = [];
        if (data.elements && data.elements.length > 0) {
          spots = data.elements.map(item => {
            const itemLat = item.lat || item.center?.lat;
            const itemLon = item.lon || item.center?.lon;
            const name = item.tags?.name || item.tags?.brand || item.tags?.operator || `${currentCat.toUpperCase()} Spot`;
            const dist = getDistance(userLat, userLon, itemLat, itemLon);
            return { name, lat: itemLat, lon: itemLon, dist };
          });
          spots.sort((a, b) => a.dist - b.dist);
        }

        if (spots.length > 0) {
          document.getElementById('status').innerText = `Showing nearby ${currentCat} spots:`;
          spots.forEach(spot => {
            if (spot.lat && spot.lon) {
              L.marker([spot.lat, spot.lon]).addTo(placesGroup).bindPopup(spot.name);

              const distText = spot.dist < 1 
                ? `${Math.round(spot.dist * 1000)} meters away` 
                : `${spot.dist.toFixed(2)} km away`;

              const card = document.createElement('div');
              card.className = 'card';
              card.innerHTML = `
                <strong>${spot.name}</strong><br>
                <span style="color:#d35400; font-size:12px; font-weight:bold;">${distText}</span><br>
                <a class="dir-btn" href="https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lon}" target="_blank">🧭 Navigation</a>
              `;
              resultsDiv.appendChild(card);
            }
          });
        } else {
          document.getElementById('status').innerText = `Showing navigation options nearby:`;
        }

        // Always attach a clean, seamless search card at the bottom
        const gmapsUrl = `https://www.google.com/maps/search/${encodeURIComponent(currentCat)}+near+${userLat},${userLon}`;
        const fallbackCard = document.createElement('div');
        fallbackCard.className = 'card';
        fallbackCard.style.textAlign = 'center';
        fallbackCard.innerHTML = `
          <strong style="color: #2c3e50;">Looking for additional options?</strong>
          <a class="fallback-btn" href="${gmapsUrl}" target="_blank">🔍 Open Live ${currentCat.toUpperCase()} Search</a>
        `;
        resultsDiv.appendChild(fallbackCard);

      } catch (e) {
        document.getElementById('status').innerText = "Unable to load spots right now. Please retry.";
      }
    }

    requestPreciseLocation();
  </script>
</body>
</html>
